# Skeid Configuration for Service Stack
# Location: /etc/skeid/skeid.yaml (mounted from examples/service/skeid.yaml)

pricing:
  "*":
    input_per_million: 0.10
    output_per_million: 0.40

# Nodes. api_key_ref is a key reference: the OpenBao KeyBroker reads the api_key field of the
# KV v2 secret it names, per request, into memory only. skeid-init stores SKEID_GROQ_KEY there.
nodes:
  - id: groq-main
    url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    engine: openai
    api_key_ref: secret/skeid/remote/groq
  # skeid-init stores SKEID_OPENAI_KEY where this node looks for it:
  # - id: openai-main
  #   url: https://api.openai.com/v1
  #   model: gpt-4o-mini
  #   engine: openai
  #   api_key_ref: secret/skeid/remote/openai

# Usage storage via PostgreSQL.
# This stack chooses postgresql over the (faster, simpler) jsonlog dir mode on
# purpose: it is a multi-frontend deployment that wants one queryable billing
# store with real SQL reports across every worker and container. A single-node
# quick start is better served by `backend: jsonlog, path: /var/log/skeid/events/`
# (see the README "Usage and billing" section) -- no database to run.
# Skeid creates the usage_events table itself on start (auto_migrate, from
# share/sql/usage_events.postgresql.sql) and adds any column an older table lacks.
usage_store:
  backend: postgresql
  dsn: "dbi:Pg:dbname=skeid;host=postgres;port=5432"
  user: skeid
  password_env: SKEID_USAGE_DB_PASSWORD

# Admin API protection
admin:
  api_key_env: SKEID_ADMIN_API_KEY

# Routing config
routing:
  wait_timeout_ms: 2000
  wait_poll_ms: 25
  # Believe x-skeid-key-id from the client. Only correct when something in front of Skeid
  # authenticates the caller and sets the header -- otherwise any client can pick its own
  # routing policy and somebody else's invoice.
  trust_key_id_header: false

# Model aliases (ADR 0008). A client-facing name resolves to an ordered list of tiers, tried
# until one has free capacity. Tag your nodes (tags: [local] / [cloud]) to use this.
#
# aliases:
#   house-model:
#     tiers:
#       - tags: [local]
#         model: qwen3-32b
#         wait_ms: 200      # wait this long for a local GPU before paying for cloud
#       - tags: [cloud]
#         model: llama-3.3-70b-versatile
#
# wait_ms defaults to 0 -- fall through immediately unless you ask to wait.

# Per-key routing policy (ADR 0008). Profiles are the standard setups; a key takes one, or one
# plus an override of a single field. Keys are named by the id their API key resolves to --
# `skeid keyid sk-alice-secret-key` prints it -- so the config never holds a customer key.
#
# policies:
#   standard:  { deny_tags: [cloud] }     # our hardware only, 429 rather than spill to cloud
#   burstable: {}                         # cloud is fine when local is full
#   trial:     { models: [house-model] }  # one product, and it may go anywhere
# default_policy: standard
# keys:
#   alice: burstable                      # by readable name, via the names: registry below
#   bigcorp:
#     policy: standard
#     deny_tags: [cloud, eu-outside]      # replaces the profile's deny list
#   k_1122334455aae5f60718293a4b5c6d7e8f901a2b: burstable  # or still by the raw key id, with no name entry
#
# names: is a readable-name -> key-id registry that lives here in the config. It makes the
# keys: lines legible and turns key rotation into a one-line edit -- repoint the name and every
# policy that named the customer follows. Its values are ids from `skeid keyid`, never customer
# keys, and it is read only at config load, never on the request path (ADR 0008).
# names:
#   alice:   k_28f8389e824f2273c846b9562cffc72a4f10a651  # `skeid keyid sk-alice-secret-key` prints this
#   bigcorp: k_9c8b7a6f5e4de5f60718293a4b5c6d7e8f901a2b
#
# Unlisted keys take default_policy, so a deployment where every customer is configured the
# same way carries no key entries at all.

# Client authentication. Skeid does not check client keys unless this section is here: behind
# another gateway that authenticates, leave it out. When Skeid itself is the public entry, list
# the key ids that may come in -- every /v1/* and /api/* route and the provider manifest then
# answer 401 to a missing key or one not listed; /health and the admin API keep their own rules.
# Entries are key ids from `skeid keyid <key>` or names: entries, never the keys themselves.
# One shared client key today is one id; give clients keys of their own later by adding names:
# entries here, and taking a name out locks that client out on the next request.
#
# client_auth:
#   keys: [shared]          # with names: { shared: k_... } above, or the k_... id directly

# Customer source (ADR 0024). Customers created and revoked by another application that owns a
# database: Skeid reads one view, `SELECT key_id, name, policy, models FROM <relation>`, one row
# per ACTIVE key id (a revoked key is a row that is absent), and never writes. key_id is
# k_ + 40 hex from `skeid keyid`, policy names a profile in policies: above (NULL = default_policy),
# models is a JSON list that narrows it (NULL = the profile decides). A bad row grants nothing and
# never fails a reload; the file wins per key id; with client_auth the rows join the allowlist.
# The password comes from the environment, never from this file. Without this section nothing
# reads a database.
#
# customer_source:
#   dsn: dbi:Pg:dbname=skeid;host=postgres        # or from_usage_store: true (own connection)
#   user: skeid_customers_ro                      # a role with SELECT on that one view
#   password_env: SKEID_CUSTOMERS_PASSWORD
#   relation: skeid_customer_keys
#   poll_interval_s: 30       # revocation latency is this, plus the config reload throttle
#   max_stale_s: 0            # 0 = keep the last good snapshot through an outage
#   connect_timeout_s: 5
#   listen: skeid_customers   # optional NOTIFY channel as a wake-up hint; the poll stays the floor
#
# By hand against a real PostgreSQL (what the offline tests cannot prove: libpq against a
# server, and LISTEN/NOTIFY):
#   1. psql: CREATE VIEW skeid_customer_keys AS SELECT 'k_<40 hex>'::text AS key_id,
#      'Alice'::text AS name, 'standard'::text AS policy, NULL::jsonb AS models;
#      GRANT SELECT ON skeid_customer_keys TO skeid_customers_ro;
#   2. Start `skeid serve --config ...` with the section above and the client_auth section:
#      the first request with that key answers 200 after the first fetch (log: nothing), and
#      GET /skeid/config shows customer_source {snapshot: 1, accepted: 1}.
#   3. Revoke: DELETE the row / change the view. Within poll_interval_s the key answers 401.
#      With `listen:`, run `NOTIFY skeid_customers;` after the change: the 401 comes at once.
#   4. Outage: stop PostgreSQL. Requests keep working (last snapshot); /skeid/config shows
#      customer_source.ok: 0, error_kind: connect. Point the dsn at a blackholed address
#      (10.255.255.1) and check `curl /health` stays instant while the fetch fails.

# MCP servers (ADR 0022). Assign MCP servers to customer key ids; a customer then reaches
# /mcp/<name> with its own Skeid key, and GET /v1/mcp/servers tells it what it was assigned.
# Skeid relays MCP's Streamable HTTP and reads none of it. The client's key never goes upstream:
# a server's own key is named like a node's -- api_key_ref through OpenBao, or api_key_env --
# and sent as Authorization: Bearer. `transport: stdio` entries are not proxied; they tell the
# customer what to run on its own machine, so keep secrets out of command, args and env.
# Without this section the routes do not exist.
#
# mcp:
#   public_url: https://llm.example.com   # where clients reach Skeid; else taken from the request
#   servers:
#     bookrag:
#       url: http://bookrag-mcp:8080/mcp
#       description: Book search over the house library
#       api_key_ref: secret/skeid/mcp/bookrag
#       keys: [alice]                     # names: entries or key ids from `skeid keyid`
#     files:
#       transport: stdio
#       command: mcp-files
#       args: ["--root", "/srv/data"]
#       description: Files on your own machine
#       keys: [alice]

# Capacity probes (ADR 0009). inflight counts only what THIS Skeid sent, so two frontends in
# front of the same GPU each think it is half as busy as it is. A probe reads what the node
# itself reports, including traffic Skeid never saw.
#
# nodes:
#   - id: gpu-1
#     url: http://gpu-1:8000/v1
#     model: qwen3-32b
#     tags: [local]
#     max_conns: 32
#     capacity:
#       probe: prometheus
#       path: /metrics          # or a full url: for a sidecar
#       interval_ms: 2000
#       # running/waiting default to the vLLM, SGLang and TGI metric names
#       # limit: 32             # defaults to max_conns
#
# Cloud nodes need no configuration: rate-limit headers are read off responses Skeid already
# receives, so a provider that says "0 remaining" stops being admitted until it says otherwise.
# A probe can only ever narrow max_conns, never raise it.

# API description (ADR 0025). GET /openapi.json is always served; the Swagger UI at /docs is
# off unless switched on. Skeid does not ship the UI: the first request for it downloads the
# pinned swagger-ui-dist and caches it in cache_dir (writable for the skeid user).
#
# openapi:
#   swagger_ui: true
#   cache_dir: /var/lib/skeid/swagger-ui
